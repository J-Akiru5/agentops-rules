name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Release gate
        run: node scripts/release-check.mjs --tag "${GITHUB_REF_NAME}"

      - name: Installer tests
        run: node --test install.test.mjs
      - name: Orchestrator tests
        run: node --test bin/orchestrator.test.mjs
      - name: AgentOps suite
        run: node --test bin/agentctl.test.mjs

      - name: Build release artifact
        run: git archive --format=zip --output=agentops-rules.zip "${GITHUB_REF_NAME}"

      - name: Checksum
        run: sha256sum agentops-rules.zip > agentops-rules.zip.sha256

      - name: Release notes
        run: node scripts/release-notes.mjs --tag "${GITHUB_REF_NAME}" --out release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists. Tags and releases are immutable." >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" \
            agentops-rules.zip agentops-rules.zip.sha256 \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
